<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="在本地图库中查找裁切图片对应的原图">
    <link rel="icon" href="data:,">
    <title>图像裁切匹配</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>图像裁切匹配</strong>
          <small>本地图库</small>
        </span>
      </a>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="深色模式"
      >
        <span class="theme-toggle-thumb" aria-hidden="true">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" focusable="false">
            <g class="theme-toggle-sun">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </g>
            <path class="theme-toggle-moon" d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6a8.5 8.5 0 1 0 11.6 11.6Z"></path>
          </svg>
        </span>
      </button>
    </header>

    <main id="search-workspace" class="search-workspace">
      <section id="upload-view" class="upload-view" aria-label="图片上传">
        <div class="index-status" id="index-status" role="status" aria-live="polite" data-state="building">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">正在读取索引状态...</span>
        </div>

        <section class="gallery-selector" aria-labelledby="gallery-selector-heading">
          <div class="gallery-current">
            <h2 id="gallery-selector-heading">当前图库</h2>
            <output id="current-gallery-path">正在读取...</output>
          </div>
          <form id="gallery-switch-form" class="gallery-switch-form">
            <label for="gallery-path">切换到绝对路径</label>
            <div class="gallery-switch-fields">
              <input
                id="gallery-path"
                name="gallery-path"
                type="text"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="gallery-path-help gallery-switch-status"
              >
              <button id="switch-gallery-button" class="secondary-button" type="submit">切换图库</button>
            </div>
            <p id="gallery-path-help" class="gallery-path-help">输入包含原图的本机文件夹绝对路径</p>
            <p id="gallery-switch-status" class="gallery-switch-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <div class="upload-panel">
          <div
            id="drop-zone"
            class="drop-zone"
            role="button"
            aria-label="上传裁切图：拖放到此处，或选择本地图片；选择图片"
            tabindex="0"
            aria-disabled="true"
            aria-controls="file-input"
            aria-describedby="upload-help"
          >
            <span class="crop-frame" aria-hidden="true"></span>
            <p>拖放到此处，或选择本地图片</p>
            <span class="picker-label" aria-hidden="true">选择图片</span>
          </div>
          <label class="visually-hidden" for="file-input">选择图片</label>
          <input id="file-input" class="visually-hidden" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp" tabindex="-1" disabled>
          <p id="upload-help" class="upload-help">支持 JPG、JPEG、PNG、WebP、BMP；不超过 10 MiB、25 MP</p>
          <div id="loading-status" class="loading-status" role="status" aria-live="polite" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>正在查找原图...</span>
          </div>
          <p id="error-message" class="error-message" role="alert" hidden></p>
        </div>
      </section>

      <section id="results-view" class="results-view" aria-labelledby="results-heading">
        <div class="results-toolbar">
          <div>
            <p class="eyebrow">检索结果</p>
            <h1 id="results-heading" tabindex="-1">匹配结果</h1>
          </div>
        </div>

        <div id="results-empty" class="results-empty">
          <p class="eyebrow">等待查询</p>
          <h2>上传一张裁切图开始检索</h2>
          <p>匹配到的原图会显示在这里。</p>
        </div>

        <section id="query-summary" class="query-summary" aria-labelledby="query-heading" hidden>
          <img id="query-preview" alt="已上传的查询图片">
          <div>
            <h2 id="query-heading">查询图片</h2>
            <p id="query-name"></p>
            <p id="query-meta" class="muted"></p>
          </div>
        </section>

        <ol id="result-list" class="result-list" aria-label="匹配到的原图" hidden></ol>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
