<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="在本地图库中查找裁切图片对应的原图">
    <link rel="icon" href="data:,">
    <title>图像裁切匹配</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>图像裁切匹配</strong>
          <small>本地图库</small>
        </span>
      </a>
    </header>

    <main>
      <section id="upload-view" class="upload-view" aria-labelledby="upload-heading">
        <div class="index-status" id="index-status" role="status" aria-live="polite" data-state="building">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">正在读取索引状态...</span>
        </div>

        <div class="upload-panel">
          <div
            id="drop-zone"
            class="drop-zone"
            role="button"
            tabindex="0"
            aria-disabled="true"
            aria-controls="file-input"
            aria-describedby="upload-help"
          >
            <span class="crop-frame" aria-hidden="true"></span>
            <h1 id="upload-heading">上传一张裁切图</h1>
            <p>拖放到此处，或选择本地图片</p>
            <span class="picker-label" aria-hidden="true">选择图片</span>
          </div>
          <label class="visually-hidden" for="file-input">选择图片</label>
          <input id="file-input" class="visually-hidden" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp" tabindex="-1" disabled>
          <p id="upload-help" class="upload-help">支持 JPG、JPEG、PNG、WebP、BMP；不超过 10 MiB、25 MP</p>
          <div id="loading-status" class="loading-status" role="status" aria-live="polite" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>正在查找原图...</span>
          </div>
          <p id="error-message" class="error-message" role="alert" hidden></p>
        </div>
      </section>

      <section id="results-view" class="results-view" aria-labelledby="results-heading" hidden>
        <div class="results-toolbar">
          <div>
            <p class="eyebrow">查询完成</p>
            <h1 id="results-heading" tabindex="-1">匹配结果</h1>
          </div>
          <button id="reupload-button" class="secondary-button" type="button">重新上传</button>
        </div>

        <section id="query-summary" class="query-summary" aria-labelledby="query-heading" hidden>
          <img id="query-preview" alt="已上传的查询图片">
          <div>
            <h2 id="query-heading">查询图片</h2>
            <p id="query-name"></p>
            <p id="query-meta" class="muted"></p>
          </div>
        </section>

        <ol id="result-list" class="result-list" aria-label="匹配到的原图"></ol>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
